<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowSocket Voice P2P</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    .header { width: 100%; max-width: 500px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.25rem; color: #e2e8f0; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: #22c55e; }

    .top-code-banner {
      width: 100%; max-width: 500px; background: #1e293b; border: 1px solid #3b82f6;
      border-radius: 8px; padding: 12px 16px; display: none; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .top-code-banner.active { display: flex; }
    .call-code-value { font-family: monospace; font-size: 1.3rem; font-weight: bold; color: #38bdf8; letter-spacing: 2px; }

    .container { width: 100%; max-width: 500px; background: #1e293b; border-radius: 12px; padding: 20px; }
    .screen { display: none; flex-direction: column; gap: 16px; }
    .screen.active { display: flex; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.875rem; color: #94a3b8; }
    input[type="text"] { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
    
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; }
    .btn-danger { background: #991b1b; }
    .btn-danger:hover { background: #7f1d1d; }
    
    .btn-mic { background: #16a34a; margin-top: 10px; }
    .btn-mic.muted { background: #dc2626; }

    .participants-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .user-badge { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; color: #38bdf8; }
    
    .sys-log { font-size: 0.8rem; color: #64748b; text-align: center; margin-top: 10px; min-height: 20px; }
  </style>
</head>
<body>

<div class="header">
  <h1>ShadowSocket Voice</h1>
  <div style="font-size: 0.8rem; color: #94a3b8;">
    <span class="status-dot" id="net-status-dot"></span>
    <span id="net-status-text">Оффлайн</span>
  </div>
</div>

<div id="top-code-banner" class="top-code-banner">
  <div>
    <div style="font-size: 0.75rem; color: #94a3b8;">КОД ЗВОНКА:</div>
    <div class="call-code-value" id="display-call-code">------</div>
  </div>
  <button class="btn btn-secondary" onclick="copyCode()">Копировать</button>
</div>

<div class="container">
  <!-- Вход -->
  <div id="screen-auth" class="screen active">
    <div class="form-group">
      <label>Ваш никнейм:</label>
      <input type="text" id="username" placeholder="Гость_123">
    </div>
    <button class="btn" onclick="initUserAndMic()">Войти и включить микрофон</button>
  </div>

  <!-- Меню -->
  <div id="screen-hub" class="screen">
    <button class="btn" onclick="createRoom()">+ Создать звонок</button>
    <div class="form-group">
      <label>Подключиться по коду:</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="join-code-input" placeholder="Код...">
        <button class="btn btn-secondary" onclick="joinRoom()">Войти</button>
      </div>
    </div>
  </div>

  <!-- Голосовой звонок -->
  <div id="screen-room" class="screen">
    <label>В разговоре:</label>
    <div class="participants-list" id="participants"></div>

    <button id="mic-toggle-btn" class="btn btn-mic" onclick="toggleMic()">🎤 Микрофон: ВКЛ</button>
    <button class="btn btn-danger" onclick="leaveRoom()">Завершить звонок</button>

    <div class="sys-log" id="sys-log"></div>
  </div>
</div>

<audio id="remote-audio" autoplay playsinline></audio>

<script>
  firebase.initializeApp({ databaseURL: "https://antongram-ce54a-default-rtdb.firebaseio.com/" });
  const db = firebase.database();

  let myName = "";
  let currentRoom = null;
  let pc = null;
  let localStream = null;
  let isMicMuted = false;
  let wakeLock = null;

  const rtcConfig = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80", username: "openrelay", credential: "openrelay" }
    ]
  };

  async function initUserAndMic() {
    const input = document.getElementById('username').value.trim();
    myName = input ? input : "Гость_" + Math.floor(Math.random() * 899 + 100);

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      // Настройка фонового режима (MediaSession)
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Голосовой P2P Звонок',
          artist: 'ShadowSocket',
        });
        navigator.mediaSession.setActionHandler('play', () => {});
        navigator.mediaSession.setActionHandler('pause', () => {});
      }

      showScreen('screen-hub');
    } catch(err) {
      alert("Без доступа к микрофону звонки не работают! Ошибка: " + err.message);
    }
  }

  // Блокировка засыпания экрана/вкладки
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {}
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
  }

  function toggleMic() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      isMicMuted = !isMicMuted;
      audioTrack.enabled = !isMicMuted;
      
      const btn = document.getElementById('mic-toggle-btn');
      if (isMicMuted) {
        btn.textContent = "🔇 Микрофон: ВЫКЛ";
        btn.classList.add('muted');
      } else {
        btn.textContent = "🎤 Микрофон: ВКЛ";
        btn.classList.remove('muted');
      }
    }
  }

  async function createRoom() {
    if (!localStream) return alert("Микрофон не подключен!");

    currentRoom = Math.random().toString(36).substring(2, 8).toUpperCase();
    setupRoomUI();

    pc = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    const roomRef = db.ref('calls/' + currentRoom);
    
    pc.onicecandidate = e => {
      if (e.candidate) roomRef.child('hostCandidates').push(e.candidate.toJSON());
    };

    setupAudioReceiver();

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await roomRef.set({ offer: { type: offer.type, sdp: offer.sdp }, hostName: myName });

    roomRef.child('answer').on('value', async snapshot => {
      const answer = snapshot.val();
      if (answer && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    roomRef.child('guestCandidates').on('child_added', snapshot => {
      if (pc && snapshot.val()) pc.addIceCandidate(new RTCIceCandidate(snapshot.val())).catch(e=>{});
    });

    addParticipant(myName);
    setSysLog("Ожидание собеседника...");
  }

  async function joinRoom() {
    const code = document.getElementById('join-code-input').value.trim().toUpperCase();
    if (!code) return alert("Введите код!");

    const roomRef = db.ref('calls/' + code);
    const snapshot = await roomRef.once('value');
    if (!snapshot.exists()) return alert("Комната не найдена!");

    if (!localStream) return alert("Микрофон не подключен!");

    currentRoom = code;
    setupRoomUI();

    pc = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = e => {
      if (e.candidate) roomRef.child('guestCandidates').push(e.candidate.toJSON());
    };

    setupAudioReceiver();

    const roomData = snapshot.val();
    await pc.setRemoteDescription(new RTCSessionDescription(roomData.offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await roomRef.child('answer').set({ type: answer.type, sdp: answer.sdp });

    roomRef.child('hostCandidates').on('child_added', snap => {
      if (pc && snap.val()) pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e=>{});
    });

    addParticipant(myName);
    if (roomData.hostName) addParticipant(roomData.hostName);
  }

  function setupAudioReceiver() {
    pc.ontrack = e => {
      const audio = document.getElementById('remote-audio');
      audio.srcObject = e.streams[0];
      audio.play().catch(e => setSysLog("Нажмите на экран для включения звука"));
    };

    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === 'connected') {
        document.getElementById('net-status-dot').classList.add('online');
        document.getElementById('net-status-text').textContent = "P2P Связь";
        setSysLog("Связь установлена!");
      } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
        document.getElementById('net-status-dot').classList.remove('online');
        document.getElementById('net-status-text').textContent = "Оффлайн";
        setSysLog("Соединение разорвано");
      }
    };
  }

  function setSysLog(txt) {
    document.getElementById('sys-log').textContent = txt;
  }

  function addParticipant(name) {
    const list = document.getElementById('participants');
    if (document.getElementById('p-' + name)) return;
    const badge = document.createElement('div');
    badge.className = 'user-badge';
    badge.id = 'p-' + name;
    badge.textContent = name;
    list.appendChild(badge);
  }

  function setupRoomUI() {
    showScreen('screen-room');
    requestWakeLock();
    document.getElementById('display-call-code').textContent = currentRoom;
    document.getElementById('top-code-banner').classList.add('active');
    document.getElementById('participants').innerHTML = '';
  }

  function copyCode() {
    navigator.clipboard.writeText(currentRoom);
    alert('Код скопирован!');
  }

  function leaveRoom() {
    if (pc) pc.close();
    if (currentRoom) db.ref('calls/' + currentRoom).remove();
    releaseWakeLock();
    document.getElementById('net-status-dot').classList.remove('online');
    document.getElementById('net-status-text').textContent = "Оффлайн";
    document.getElementById('top-code-banner').classList.remove('active');
    showScreen('screen-hub');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
